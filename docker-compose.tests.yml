name: joya-mini-pedidos-tests
services:
  mcp-init:
    profiles: [ai]
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    environment:
      MSSQL_SA_PASSWORD: JoyaIntegrationOnly!2026
    volumes:
      - ./database:/database:ro
    entrypoint: [/bin/bash, /database/ai/init-mcp.sh]
    depends_on:
      db-init:
        condition: service_completed_successfully
  sql-mcp:
    profiles: [ai]
    # Digest recuperado da transferência; confirmar versão efetiva na validação.
    image: mcr.microsoft.com/azure-databases/data-api-builder@sha256:d07e3e1ce53bdf84d3a4a0a4ce12e44f0b902e7316c782a3d682fbe074509c0b
    environment:
      ASPNETCORE_URLS: http://+:5000
      MCP_SQL_CONNECTION_STRING: Server=sql;Database=JoyaPedidos;User Id=joya_mcp_reader;Password=JoyaMcpReadOnly!2026;Encrypt=True;TrustServerCertificate=True
    ports:
      - 127.0.0.1:5005:5000
    volumes:
      - ./database/ai/dab-config.json:/App/dab-config.json:ro
    command: [--config, /App/dab-config.json]
    depends_on:
      mcp-init:
        condition: service_completed_successfully
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: JoyaIntegrationOnly!2026
    # Nenhum volume da aplicação: dados descartáveis nesta instância separada.
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    environment:
      MSSQL_SA_PASSWORD: JoyaIntegrationOnly!2026
    volumes:
      - ./database:/database:ro
    entrypoint: [/bin/bash, /database/init.sh]
    depends_on:
      sql:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Pedidos: Server=sql;Database=JoyaPedidos;User Id=sa;Password=JoyaIntegrationOnly!2026;Encrypt=True;TrustServerCertificate=True
    depends_on:
      db-init:
        condition: service_completed_successfully
  query-analysis:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    environment:
      SQLCMDPASSWORD: JoyaIntegrationOnly!2026
    volumes:
      - ./database:/database:ro
      - ./TestResults/sql:/results
    entrypoint: [/opt/mssql-tools18/bin/sqlcmd]
    command: [-S, sql, -U, sa, -C, -b, -d, JoyaPedidos, -i, /database/queries/comparar-ranking.sql, -o, /results/comparacao-ranking.txt, -y, '0', -w, '65535']
    depends_on:
      db-init:
        condition: service_completed_successfully
  integration-tests:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: integration-tests
    environment:
      JOYA_INTEGRATION_ENABLED: '1'
      JOYA_INTEGRATION_API: http://api:8080
      JOYA_INTEGRATION_SQL: Server=sql;Database=JoyaPedidos;User Id=sa;Password=JoyaIntegrationOnly!2026;Encrypt=True;TrustServerCertificate=True
    depends_on:
      api:
        condition: service_started
      db-init:
        condition: service_completed_successfully
